name: Build Pop!_OS for Sheng

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: Optional HTTPS mirror for the pinned System76 ARM64 ISO
        type: string
        required: false
      qemu_smoke_test:
        description: Boot the Pop!_OS rootfs on a generic ARM64 QEMU machine
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cosmic-settings:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compile the patched COSMIC Settings package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper devscripts just \
            libdav1d-dev libinput-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal
          bash scripts/fetch-inputs.sh --cosmic-only
          SHENG_POP_COSMIC_WORK="$RUNNER_TEMP" bash scripts/build-cosmic-settings.sh

      - uses: actions/upload-artifact@v7
        with:
          name: cosmic-settings-sheng-arm64
          path: apt-local/pool/cosmic-settings_*+sheng1_arm64.deb
          if-no-files-found: error
          retention-days: 7

  build:
    needs: cosmic-settings
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cosmic-settings-sheng-arm64
          path: apt-local/pool

      - name: Install build tools
        env:
          QEMU_SMOKE_TEST: ${{ inputs.qemu_smoke_test }}
        run: |
          sudo apt-get update
          packages=(bc bison build-essential clang cpio curl device-tree-compiler
            dpkg-dev e2fsprogs file flex gnupg kmod libelf-dev libssl-dev lld
            llvm lz4 python3 rsync squashfs-tools xz-utils zstd android-sdk-libsparse-utils)
          if [[ $QEMU_SMOKE_TEST == true ]]; then packages+=(qemu-system-arm); fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          sudo apt-get clean
          printf 'SHENG_POP_WORK=%s\n' "$RUNNER_TEMP/popos-sheng" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Download and verify pinned sources
        env:
          SHENG_POP_ISO_URL: ${{ inputs.iso_url }}
        run: bash scripts/fetch-inputs.sh

      - name: Compile and package the Sheng kernel
        run: |
          sudo env SHENG_POP_WORK="$SHENG_POP_WORK" SHENG_POP_JOBS="$(nproc)" \
            bash scripts/build-kernel.sh
          test "$SHENG_POP_WORK" = "$RUNNER_TEMP/popos-sheng"
          sudo rm -r -- "$SHENG_POP_WORK/kernel-src" "$SHENG_POP_WORK/kernel-build"
          df -h "$SHENG_POP_WORK"

      - name: Extract the Pop!_OS ARM64 system and build device packages
        run: |
          sudo env SHENG_POP_WORK="$SHENG_POP_WORK" SHENG_POP_UNSQUASH_JOBS="$(nproc)" \
            bash scripts/prepare-rootfs.sh
          rm -- inputs/pop-os_26.04_arm64_generic_1.iso
          sudo env SHENG_POP_WORK="$SHENG_POP_WORK" bash scripts/build-device-packages.sh

      - name: Build and verify the compressed flash image
        run: |
          sudo env SHENG_POP_WORK="$SHENG_POP_WORK" SHENG_POP_COMPRESS_ROOTFS=1 \
            bash scripts/build-image.sh
          sudo env SHENG_POP_WORK="$SHENG_POP_WORK" bash scripts/publish-local-apt.sh
          (cd out && sha256sum -c SHA256SUMS.download)

      - name: Boot generic ARM64 in QEMU
        if: inputs.qemu_smoke_test
        run: |
          gzip -dc out/kernel/Image.gz > "$RUNNER_TEMP/sheng-Image"
          sudo python3 scripts/smoke-boot.py "$SHENG_POP_WORK/rootfs.ext4" \
            "$RUNNER_TEMP/sheng-Image" "$(cat out/kernelrelease.txt)" --timeout 300 \
            | tee out/qemu-smoke.log

      - name: Prepare and verify Release assets
        run: |
          sudo rm -- "$SHENG_POP_WORK/rootfs.ext4"
          bash scripts/prepare-release.sh

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sheng-popos-26.04-arm64-build
          path: |
            out/packages.tsv
            out/iso-packages.tsv
            out/sources.tsv
            out/device-sources.tsv
            out/kernelrelease.txt
            out/kernel/config-*
            out/dpkg-audit.txt
            out/cosmic-library-check.txt
            out/*.log
            out/local-apt-policy.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the flash images and signed APT repository to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="popos-26.04-sheng-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Pop!_OS 26.04 for Sheng · Build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            --notes "Xiaomi Pad 6S Pro (sheng), ARM64 COSMIC. Verify SHA256SUMS.download, join any numbered parts in order, decompress the .zst archives, and verify SHA256SUMS before flashing. See README.md at this tag for commands."
          for asset in out/release/*; do
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber; then break; fi
              if [[ $attempt == 3 ]]; then exit 1; fi
              sleep 5
            done
          done
          gh release edit "$tag" --draft=false
